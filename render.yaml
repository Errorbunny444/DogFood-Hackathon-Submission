services:
  - type: web
    name: dogfood-2026
    env: docker
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: SEED_DEMO_DATA
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: SESSION_SECRET
        generateValue: true
